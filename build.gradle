plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
    id 'net.ltgt.errorprone' version '4.0.1'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

sourceSets.main.resources {
    exclude("**/*.bbmodel") // BlockBench project files
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    mavenLocal()
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
        }
    }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        forRepositories(fg.repository)
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // 排在 mixin processor 之前，避免其捆绑的 Guava 21 遮蔽新版 Guava 导致 ErrorProne 崩溃
    annotationProcessor "com.google.guava:guava:33.2.1-jre"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // NullAway 编译期空指针检查
    errorprone "com.google.errorprone:error_prone_core:${errorprone_version}"
    errorprone "com.uber.nullaway:nullaway:${nullaway_version}"

    // MixinExtras
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.3.6"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.3.6")) {
        jarJar.ranged(it, "[0.3.0,)")
    }

    // JEI相关
    // compile against the JEI API but do not include it at runtime
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"))
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"))
    // at runtime, use the full JEI jar for Forge
    runtimeOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}"))

    // Jade相关
    implementation fg.deobf("curse.maven:jade-324717:${jade_version}")

    runtimeOnly fg.deobf("curse.maven:spark-361579:4738952")
    // 伤害数字显示
    runtimeOnly fg.deobf("curse.maven:damage-numbers-floating-damage-indicators-crits-1754205:9369101")
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : 'susen36',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'susen36',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }

    finalizedBy 'reobfJar'
}

// Sources jar for Maven publication (used by JitPack and local repo consumers)
tasks.register('sourcesJar', Jar) {
    from sourceSets.main.allJava
    archiveClassifier = 'sources'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifact sourcesJar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.errorprone {
        check('NullAway', net.ltgt.gradle.errorprone.CheckSeverity.ERROR)

        errorproneArgs.add('-XepOpt:NullAway:AnnotatedPackages=com.susen36.babel')
        // ErrorProne 2.36.0 ParameterName 检查器存在 subSequence 越界崩溃，禁用
        errorproneArgs.add('-Xep:ParameterName:OFF')
        // 仅保留 Mixin/Forge 框架必然触发的误报
        errorproneArgs.addAll([
                '-Xep:ReferenceEquality:OFF',        // 实体比较必须用引用相等，equals 会被实体 ID 重写干扰
                '-Xep:UnusedMethod:OFF',             // @Inject / @WrapOperation 等注入方法无 Java 调用方
                '-Xep:UnusedVariable:OFF',           // @Shadow 字段 / Mixin 暂存字段无直接读写
                '-Xep:FutureReturnValueIgnored:OFF', // Forge 事件总线 / 网络层大量丢弃 Future
                '-Xep:InlineMeSuggester:OFF',        // Minecraft 大量使用 @Deprecated，替换建议不适用
                '-Xep:ThreadJoinLoop:OFF',           // ErrorProne 2.36.0 扫描特定代码时 AST 节点越界崩溃
                '-Xep:ImmutableEnumChecker:OFF'      // 枚举持有 Factory 避免冗长 switch 的设计模式误报
        ])
        // @Shadow 字段由 Mixin 在运行时注入，NullAway 无法追踪其赋值
        errorproneArgs.add('-XepOpt:NullAway:ExcludedFieldAnnotations=org.spongepowered.asm.mixin.Shadow')
        // 注册类静态字段由 Forge 在类加载后赋值，非真实空指针风险
        errorproneArgs.add('-XepOpt:NullAway:ExcludedClasses=com.susen36.babel.init.BabelCollectible,com.susen36.babel.BabelConfig')
    }
    options.compilerArgs.add('-XDshould-stop.ifError=FLOW')
}

tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}