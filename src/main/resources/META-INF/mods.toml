modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
logoFile="babel_logo.png"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="susen36"
description='''
Babel (巴别塔) — Arknight Common Library.
'''

[[mixins]]
config="babel.mixins.json"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jade"
    mandatory=false
    versionRange="[1,)"
    ordering="AFTER"
    side="CLIENT"